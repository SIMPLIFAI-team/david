name: setup-maintain-deploy-via-portmason

on:
  workflow_dispatch:
    inputs:
      collection_date:
        description: "Optional publication collection date (YYYY-MM-DD). Leave blank for today in each collection timezone."
        required: false
        type: string
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: portmason-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    env:
      PROJECT_DIR: site
      OPS_DIR: ops-and-sops

    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          path: ${{ env.PROJECT_DIR }}
          fetch-depth: 0

      - name: Read pinned Portmason revision
        id: portmason-ref
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          ref_file=".portmason-tooling-ref"

          [[ -r "${ref_file}" ]] || {
            echo "::error::${ref_file} is missing or unreadable"
            exit 1
          }

          ref="$(tr -d '[:space:]' < "${ref_file}")"
          ref="${ref,,}"

          [[ "${ref}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::${ref_file} must contain one full 40-character Git commit SHA"
            exit 1
          }

          printf 'sha=%s\n' "${ref}" >> "${GITHUB_OUTPUT}"

      - name: Check out pinned Portmason tooling
        uses: actions/checkout@v4
        with:
          repository: domer6811/ops-and-sops
          ref: ${{ steps.portmason-ref.outputs.sha }}
          token: ${{ secrets.OPS_AND_SOPS_READ_TOKEN }}
          path: ${{ env.OPS_DIR }}
          sparse-checkout: |
            ops/portmason
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Register Portmason
        shell: bash
        run: |
          set -euo pipefail

          portmason_share="${GITHUB_WORKSPACE}/${OPS_DIR}/ops/portmason"

          [[ -d "${portmason_share}" ]] || {
            echo "::error::Portmason directory is missing: ${portmason_share}"
            exit 1
          }

          [[ -x "${portmason_share}/pm-setup" ]] || {
            echo "::error::pm-setup is missing or not executable"
            exit 1
          }

          printf 'PORTMASON_SHARE=%s\n' "${portmason_share}" >> "${GITHUB_ENV}"
          printf '%s\n' "${portmason_share}" >> "${GITHUB_PATH}"

      - name: Run Portmason setup
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          GITHUB_ACTIONS: "true"
          PM_NO_REDIRECT: "1"
          PM_OFFICIAL_BUILD: "true"
          PM_SOURCE_COMMIT: ${{ github.sha }}
          PM_SOURCE_DIRTY: "false"
          PM_DEPLOY_ENV: prd
          PM_DEPLOYMENT_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
          PM_STATIC_COLLECTION_DATE: ${{ inputs.collection_date || '' }}
        run: |
          set -euo pipefail

          pm-setup

      - name: Resolve static publication directory
        id: publication
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          # Portmason owns runtime and document-root resolution.
          # shellcheck disable=SC1090
          . "${PORTMASON_SHARE}/pm-helpers" --read-only

          [[ "${RUNTIME_CODE:-}" == "static" ]] || {
            echo "::error::Expected Portmason static runtime, found ${RUNTIME_CODE:-<unset>}"
            exit 1
          }

          site_dir="${SITE_DIR:-}"
          [[ -n "${site_dir}" && -d "${site_dir}" ]] || {
            echo "::error::Portmason SITE_DIR is missing or not a directory: ${site_dir:-<unset>}"
            exit 1
          }

          case "${site_dir}" in
            "${GITHUB_WORKSPACE}/${PROJECT_DIR}"/*)
              ;;
            *)
              echo "::error::Resolved SITE_DIR escapes the checked-out project: ${site_dir}"
              exit 1
              ;;
          esac

          printf 'path=%s\n' "${site_dir}" >> "${GITHUB_OUTPUT}"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.publication.outputs.path }}

      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Finalize static publication
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          APP_URL: ${{ steps.deploy.outputs.page_url }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_ACTIONS: "true"
          PM_NO_REDIRECT: "1"
        run: |
          set -euo pipefail

          . "${PORTMASON_SHARE}/pm-helpers"
          pm-publish-finalize-static
