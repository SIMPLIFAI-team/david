name: Generate and deploy David site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: david-site-pages
  cancel-in-progress: true

jobs:
  verify-and-generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Compose bind-mount contract
        run: tests/verify-compose-contract

      - name: Run Foundation and visual-contract tests
        run: |
          docker compose --profile tools run --rm --no-deps toolbox \
            python -m unittest discover -s tests -v

      - name: Generate production collection HTML
        working-directory: deploy/prd
        run: |
          docker compose --profile tools run --rm --no-deps toolbox \
            portmason/pm-process-site-partials

      - name: Verify Pages artifact
        run: |
          test -f deploy/prd/www/index.html
          test -f deploy/prd/www/CNAME
          test -f deploy/prd/www/collections/case-studies/items.json
          test -f deploy/prd/www/collections/resumes/items.json
          ! grep -q 'fallbackCaseStudies' deploy/prd/www/index.html
          tar -C deploy/prd/www -cf /dev/null .

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy/prd/www

  deploy:
    runs-on: ubuntu-latest
    needs: verify-and-generate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
