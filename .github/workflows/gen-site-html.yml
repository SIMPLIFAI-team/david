name: Generate site HTML

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gen-site-html
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: deploy/prd

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify shared legacy Portmason contract
        shell: bash
        working-directory: .
        run: |
          bash tests/verify-compose-contract
          bash tests/verify-production-entrypoints
          bash tests/verify-portmason-alignment
          bash tests/verify-portmason-shared-contract

      - name: Run Foundation and visual-contract tests
        shell: bash
        working-directory: .
        run: |
          docker compose --profile tools run --rm --no-deps toolbox \
            python -m unittest discover -s tests -v

      - name: Generate production site HTML
        run: |
          docker compose \
            -f docker-compose.yml \
            run --rm \
            -e SITE_DIR=/workspace/www \
            -e GITHUB_ACTIONS=true \
            -e GITHUB_SHA="${GITHUB_SHA}" \
            toolbox \
            sh -lc 'if test -f "$PORTMASON_SHARE/pm-process-site-partials"; then entrypoint="$PORTMASON_SHARE/pm-process-site-partials"; elif test -f "$PORTMASON_SHARE/bin/pm-process-site-partials"; then entrypoint="$PORTMASON_SHARE/bin/pm-process-site-partials"; else echo "ERROR: missing legacy Portmason entrypoint under $PORTMASON_SHARE" >&2; exit 1; fi; test -r "$entrypoint" || { echo "ERROR: unreadable legacy Portmason entrypoint: $entrypoint" >&2; exit 1; }; exec python3 "$entrypoint"'

      - name: Verify Pages artifact readability
        shell: bash
        working-directory: .
        run: |
          artifact_root="deploy/prd/www"
          test -f "${artifact_root}/index.html"
          test -f "${artifact_root}/CNAME"
          test -f "${artifact_root}/collections/case-studies/items.json"
          test -f "${artifact_root}/collections/resumes/items.json"
          unreadable_files="$(find "$artifact_root" -type f ! -readable -print)"
          if [[ -n "$unreadable_files" ]]; then
            echo "Pages artifact contains unreadable files:" >&2
            printf '%s\n' "$unreadable_files" >&2
            exit 1
          fi
          tar -C "$artifact_root" -cf /dev/null .

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy/prd/www

  deploy:
    runs-on: ubuntu-latest
    needs: generate

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
